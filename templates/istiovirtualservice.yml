{{- range $name, $virtualservice := .Values.istiovirtualservices }}
{{- if not ($virtualservice.disabled | default false) }}
---
apiVersion: {{ include "helpers.capabilities.istiovirtualservice.apiVersion" $ }}
kind: VirtualService
metadata:
  name: {{ include "helpers.app.fullname" (dict "name" ($virtualservice.name | default $name) "context" $) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "helpers.app.labels" $ | nindent 4 }}
    {{- with $virtualservice.labels }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
  annotations:
    {{- include "helpers.app.genericAnnotations" $ | indent 4 }}
    {{- with $virtualservice.annotations }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
spec:
  {{- with $virtualservice.hosts }}
  hosts:
    {{- range . }}
    - {{ include "helpers.tplvalues.render" (dict "value" . "context" $) | trim | quote }}
    {{- end }}
  {{- end }}
  {{- with $virtualservice.gateways }}
  gateways:
    {{- range . }}
    - {{ include "helpers.tplvalues.render" (dict "value" . "context" $) | trim | quote }}
    {{- end }}
  {{- end }}
  {{- with $virtualservice.exportTo }}
  exportTo:
    {{- range . }}
    - {{ include "helpers.tplvalues.render" (dict "value" . "context" $) | trim | quote }}
    {{- end }}
  {{- end }}
  {{- with $virtualservice.http }}
  http:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $virtualservice.tcp }}
  tcp:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $virtualservice.tls }}
  tls:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}