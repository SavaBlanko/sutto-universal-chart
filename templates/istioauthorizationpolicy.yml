{{- range $name, $policy := .Values.istioauthorizationpolicies }}
{{- if not ($policy.disabled | default false) }}
---
apiVersion: {{ include "helpers.capabilities.istioauthorizationpolicy.apiVersion" $ }}
kind: AuthorizationPolicy
metadata:
  name: {{ include "helpers.app.fullname" (dict "name" ($policy.name | default $name) "context" $) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "helpers.app.labels" $ | nindent 4 }}
    {{- with $policy.labels }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
  {{- with $policy.annotations }}
  annotations:
    {{- include "helpers.app.genericAnnotations" $ | nindent 4 }}
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  {{- with $policy.selector }}
  selector:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $policy.targetRef }}
  targetRef:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $policy.targetRefs }}
  targetRefs:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $policy.action }}
  action: {{ include "helpers.tplvalues.render" (dict "value" . "context" $) }}
  {{- end }}
  {{- with $policy.provider }}
  provider:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- if hasKey $policy "rules" }}
  rules:
    {{- include "helpers.tplvalues.render" (dict "value" $policy.rules "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
