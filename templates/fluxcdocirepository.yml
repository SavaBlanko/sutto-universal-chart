{{- range $name, $repository := .Values.fluxcdocirepositories }}
{{- if not ($repository.disabled | default false) }}
---
apiVersion: {{ include "helpers.capabilities.ocirepository.apiVersion" $ }}
kind: OCIRepository
metadata:
  name: {{ include "helpers.app.fullname" (dict "name" ($repository.name | default $name) "context" $) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "helpers.app.labels" $ | nindent 4 }}
    {{- with $repository.labels }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
  annotations:
    {{- include "helpers.app.genericAnnotations" $ | nindent 4 }}
    {{- with $repository.annotations }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
spec:
  {{- include "helpers.tplvalues.render" (dict "value" (required (printf "fluxcdocirepositories.%s.spec is required" $name) $repository.spec) "context" $) | nindent 2 }}
{{- end }}
{{- end }}