{{- range $name, $route := .Values.httproutes }}
{{- if not ($route.disabled | default false) }}
---
apiVersion: {{ include "helpers.capabilities.httproute.apiVersion" $ }}
kind: HTTPRoute
metadata:
  name: {{ include "helpers.app.fullname" (dict "name" ($route.name | default $name) "context" $) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "helpers.app.labels" $ | nindent 4 }}
    {{- with $route.labels }}
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "helpers.app.genericAnnotations" $ | nindent 4 }}
    {{- with $route.annotations }}
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
spec:
  {{- with $route.parentRefs }}
  parentRefs:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $route.hostnames }}
  hostnames:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- if hasKey $route "rules" }}
  rules:
    {{- include "helpers.tplvalues.render" (dict "value" $route.rules "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}