{{- range $name, $route := .Values.httproutes }}
{{- if not ($route.disabled | default false) }}
---
apiVersion: {{ include "helpers.capabilities.httproute.apiVersion" $ }}
kind: HTTPRoute
metadata:
  name: {{ include "helpers.app.fullname" (dict "name" ($route.name | default $name) "context" $) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "helpers.app.labels" $ | nindent 4 }}
    {{- with $route.labels }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
  annotations:
    {{- include "helpers.app.genericAnnotations" $ | nindent 4 }}
    {{- with $route.annotations }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
spec:
  {{- with $route.parentRefs }}
  parentRefs:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $route.hostnames }}
  hostnames:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $route.rules }}
  rules:
    {{- range $rule := . }}
    - {{- with $rule.name }}
      name: {{ . | quote }}
      {{- end }}
      {{- with $rule.matches }}
      matches:
        {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with $rule.filters }}
      filters:
        {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with $rule.backendRefs }}
      backendRefs:
        {{- range $backend := . }}
        - {{- if $backend.serviceName }}
          name: {{ include "helpers.app.fullname" (dict "name" $backend.serviceName "context" $) }}
          {{- else }}
          name: {{ required "HTTPRoute backendRef requires name or serviceName" $backend.name | quote }}
          {{- end }}
          {{- with $backend.group }}
          group: {{ . | quote }}
          {{- end }}
          {{- with $backend.kind }}
          kind: {{ . | quote }}
          {{- end }}
          {{- with $backend.namespace }}
          namespace: {{ include "helpers.tplvalues.render" (dict "value" . "context" $) | quote }}
          {{- end }}
          {{- if hasKey $backend "port" }}
          port: {{ $backend.port }}
          {{- end }}
          {{- if hasKey $backend "weight" }}
          weight: {{ $backend.weight }}
          {{- end }}
          {{- with $backend.filters }}
          filters:
            {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with $rule.timeouts }}
      timeouts:
        {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
