{{- range $name, $policy := .Values.kgatewaytrafficpolicies }}
{{- if not ($policy.disabled | default false) }}
---
apiVersion: {{ include "helpers.capabilities.kgatewaytrafficpolicy.apiVersion" $ }}
kind: TrafficPolicy
metadata:
  name: {{ include "helpers.app.fullname" (dict "name" ($policy.name | default $name) "context" $) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "helpers.app.labels" $ | nindent 4 }}
    {{- with $policy.labels }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
  annotations:
    {{- include "helpers.app.genericAnnotations" $ | nindent 4 }}
    {{- with $policy.annotations }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
spec:
  {{- with $policy.targetRefs }}
  targetRefs:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $policy.targetSelectors }}
  targetSelectors:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- $spec := omit $policy "name" "disabled" "labels" "annotations" "targetRefs" "targetSelectors" }}
  {{- with $spec }}
  {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}