{{- range $name, $rule := .Values.istiodestinationrules }}
{{- if not ($rule.disabled | default false) }}
---
apiVersion: {{ include "helpers.capabilities.istiodestinationrule.apiVersion" $ }}
kind: DestinationRule
metadata:
  name: {{ include "helpers.app.fullname" (dict "name" ($rule.name | default $name) "context" $) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "helpers.app.labels" $ | nindent 4 }}
    {{- with $rule.labels }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
  annotations:
    {{- include "helpers.app.genericAnnotations" $ | indent 4 }}
    {{- with $rule.annotations }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
spec:
  host: {{ include "helpers.tplvalues.render" (dict "value" (required (printf "istiodestinationrules.%s.host is required" $name) $rule.host) "context" $) | trim | quote }}
  {{- with $rule.exportTo }}
  exportTo:
    {{- range . }}
    - {{ include "helpers.tplvalues.render" (dict "value" . "context" $) | trim | quote }}
    {{- end }}
  {{- end }}
  {{- with $rule.trafficPolicy }}
  trafficPolicy:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $rule.subsets }}
  subsets:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $rule.workloadSelector }}
  workloadSelector:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}