{{- range $host, $gateway := .Values.istiogateways }}
{{- if not ($gateway.disabled | default false) }}
---
apiVersion: {{ include "helpers.capabilities.istiogateway.apiVersion" $ }}
kind: Gateway
metadata:
  name: {{ include "helpers.app.fullname" (dict "name" ($gateway.name | default $host) "context" $) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "helpers.app.labels" $ | nindent 4 }}
    {{- with $gateway.labels }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
  annotations:
    {{- include "helpers.app.genericAnnotations" $ | indent 4 }}
    {{- with $gateway.annotations }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
spec:
  {{- with $gateway.selector }}
  selector:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  servers:
  {{- range required (printf "istiogateways.%s.servers is required" $host) $gateway.servers }}
  - hosts:
    {{- range required "Istio Gateway server hosts are required" .hosts }}
    - {{ include "helpers.tplvalues.render" (dict "value" . "context" $) | trim | quote }}
    {{- end }}
    {{- with .name }}
    name: {{ . | quote }}
    {{- end }}
    {{- with .bind }}
    bind: {{ . | quote }}
    {{- end }}
    {{- with .defaultEndpoint }}
    defaultEndpoint: {{ . | quote }}
    {{- end }}
    port:
      name: {{ required "Istio Gateway server port.name is required" .port.name | quote }}
      number: {{ required "Istio Gateway server port.number is required" .port.number }}
      protocol: {{ required "Istio Gateway server port.protocol is required" .port.protocol | quote }}
      {{- if hasKey .port "targetPort" }}
      targetPort: {{ .port.targetPort }}
      {{- end }}
    {{- with .tls }}
    tls:
      {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
