{{- range $name, $release := .Values.fluxcdhelmreleases }}
{{- if not ($release.disabled | default false) }}
---
apiVersion: {{ include "helpers.capabilities.helmrelease.apiVersion" $ }}
kind: HelmRelease
metadata:
  name: {{ include "helpers.app.fullname" (dict "name" ($release.name | default $name) "context" $) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "helpers.app.labels" $ | nindent 4 }}
    {{- with $release.labels }}
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "helpers.app.genericAnnotations" $ | nindent 4 }}
    {{- with $release.annotations }}
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
spec:
  {{- include "helpers.tplvalues.render" (dict "value" (required (printf "fluxcdhelmreleases.%s.spec is required" $name) $release.spec) "context" $) | nindent 2 }}
{{- end }}
{{- end }}