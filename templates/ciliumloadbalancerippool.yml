{{- range $name, $pool := .Values.ciliumloadbalancerippools }}
{{- if not ($pool.disabled | default false) }}
---
apiVersion: {{ include "helpers.capabilities.ciliumloadbalancerippool.apiVersion" $ }}
kind: CiliumLoadBalancerIPPool
metadata:
  name: {{ include "helpers.app.fullname" (dict "name" ($pool.name | default $name) "context" $) }}
  labels:
    {{- include "helpers.app.labels" $ | nindent 4 }}
    {{- with $pool.labels }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
  annotations:
    {{- include "helpers.app.genericAnnotations" $ | indent 4 }}
    {{- with $pool.annotations }}{{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}{{- end }}
spec:
  {{- with $pool.blocks }}
  blocks:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with $pool.allowFirstLastIPs }}
  allowFirstLastIPs: {{ include "helpers.tplvalues.render" (dict "value" . "context" $) | trim | quote }}
  {{- end }}
  {{- if hasKey $pool "specDisabled" }}
  disabled: {{ $pool.specDisabled }}
  {{- end }}
  {{- with $pool.serviceSelector }}
  serviceSelector:
    {{- include "helpers.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}